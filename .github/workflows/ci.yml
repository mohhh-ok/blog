name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore OG image cache
        uses: actions/cache@v6
        with:
          path: .cache/og
          key: og-cache-${{ hashFiles('src/content/posts/**/*.md', 'src/content/posts/**/*.mdx') }}
          restore-keys: |
            og-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          CI: "true"

      # astro check は TypeScript 7.0 に未対応なので、.astro の型を生成してから tsc で .ts を検査する
      - name: Type check
        run: |
          bun run sync
          bunx tsc --noEmit
        env:
          CI: "true"

      - name: Build
        run: bun run build
        env:
          CI: "true"
