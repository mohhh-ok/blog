name: Dependabot auto-merge

# GITHUB_TOKEN で行ったマージは push のイベントを起こさず、Deploy が走らない。
# そのため --auto に任せず、CI の完了を受けてここでマージし、続けて Deploy を workflow_dispatch で起こす。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # workflow_run は既定ブランチで動くので、判定のスクリプトも既定ブランチのものを使う
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Merge minor/patch updates and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # CI が通ったコミットを head に持つ、dependabot が作った open な PR（CI を起こしたのが誰かは問わない）
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '.[] | select(.state == "open" and .user.login == "dependabot[bot]" and .head.sha == $ENV.HEAD_SHA) | .number' | head -n1)
          if [ -z "$pr" ]; then
            echo "対象の PR が無い（head が進んだか、dependabot の PR でない）"
            exit 0
          fi
          # PR 内の dependabot のコミットの依存がすべて minor/patch のときだけマージする
          # （PR に人が修正のコミットを足しても判定できるよう、HEAD のコミットだけでは見ない。
          #   update-type が無い間接依存のセキュリティ更新は、版の差から判定する）
          msgs=$(gh api "repos/$REPO/pulls/$pr/commits" --paginate \
            --jq '.[] | select(.author.login == "dependabot[bot]") | .commit.message + "\u001e"')
          echo "PR #$pr"
          if ! printf '%s' "$msgs" | bash .github/scripts/dependabot-merge-decision.sh; then
            echo "minor/patch 以外か、版の差が判定できない依存を含むのでマージしない"
            exit 0
          fi
          # CI 完了後に head が進んでいたら失敗させる
          gh pr merge "$pr" -R "$REPO" --squash --match-head-commit "$HEAD_SHA"
          gh workflow run deploy.yaml -R "$REPO" --ref main
