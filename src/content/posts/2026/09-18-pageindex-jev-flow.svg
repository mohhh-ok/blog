<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <rect width="1200" height="720" fill="#f2f0ee"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b2922"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bb5537"/>
    </marker>
  </defs>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#19120f">Jev で「目次を降りる検索」と「総当たり」を比べる</text>
  <text x="40" y="80" font-size="15" fill="#3b2922">Zod・Hono・Elysia・Vite の 4 サイト、232 ページ、約 39 万トークン。質問は英語 48 問</text>

  <!-- 左: 木探索 -->
  <rect x="40" y="110" width="640" height="470" rx="12" fill="#ffffff" stroke="#bb5537" stroke-width="2"/>
  <text x="64" y="146" font-size="20" font-weight="700" fill="#bb5537">木探索（PageIndex 風）</text>
  <text x="64" y="170" font-size="13" fill="#3b2922">1 段 = Jev への 1 リクエスト。残した 3 つの枝ぶんの Choice を同梱する</text>

  <!-- 段のボックス -->
  <g font-size="14" fill="#19120f">
    <rect x="64" y="190" width="300" height="50" rx="8" fill="#f9f5f2" stroke="#3b2922"/>
    <text x="80" y="211" font-weight="700">1. サイト → ページ → H2 と降りる</text>
    <text x="80" y="230" font-size="12" fill="#3b2922">Choice: 下にある節の目録。「どれにも無い」も選択肢に</text>

    <rect x="64" y="262" width="300" height="50" rx="8" fill="#f9f5f2" stroke="#3b2922"/>
    <text x="80" y="283" font-weight="700">2. 節を段落に割って答えの段落を選ぶ</text>
    <text x="80" y="302" font-size="12" fill="#3b2922">Choice: 本文そのものが選択肢。要約は使わない</text>

    <rect x="64" y="334" width="300" height="50" rx="8" fill="#f9f5f2" stroke="#3b2922"/>
    <text x="80" y="355" font-weight="700">3. 「この段落に答えがあるか」を確認</text>
    <text x="80" y="374" font-size="12" fill="#3b2922">Noul: 絶対値なので段落どうしを並べられる</text>
  </g>
  <line x1="214" y1="240" x2="214" y2="262" stroke="#3b2922" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="214" y1="312" x2="214" y2="334" stroke="#3b2922" stroke-width="2" marker-end="url(#arr)"/>

  <!-- BM25 side path -->
  <rect x="404" y="190" width="250" height="122" rx="8" fill="#ffffff" stroke="#bb5537" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="420" y="214" font-size="14" font-weight="700" fill="#bb5537">木とは別に: 全文検索（BM25）</text>
  <text x="420" y="236" font-size="12" fill="#3b2922">関数名・設定キー・エラー文は</text>
  <text x="420" y="254" font-size="12" fill="#3b2922">要約から真っ先に落ちるので、</text>
  <text x="420" y="272" font-size="12" fill="#3b2922">本文の文字一致で節を 3 つ拾い、</text>
  <text x="420" y="290" font-size="12" fill="#3b2922">段落を選ぶ段（2）に合流させる</text>
  <path d="M404,287 C380,287 380,287 364,287" stroke="#bb5537" stroke-width="2" fill="none" marker-end="url(#arrA)"/>

  <!-- 木探索の結果 -->
  <g font-size="13" fill="#19120f">
    <text x="64" y="418" font-weight="700" fill="#3b2922">評価（4 サイト 48 問。1 位が正解 / 1 問の入力トークン）</text>
    <line x1="64" y1="428" x2="656" y2="428" stroke="#e1dcd8"/>
    <text x="64" y="452">木探索（目録）+ 全文検索</text>  <text x="330" y="452" font-weight="700">45/48（94%）</text> <text x="470" y="452">55k トークン</text>
    <text x="64" y="478">木探索（目録）だけ</text>  <text x="330" y="478">38/48（79%）</text> <text x="470" y="478">51k</text>
    <text x="64" y="504">全文検索だけ（Jev なし）</text>  <text x="330" y="504">43/48（90%）</text> <text x="470" y="504">0</text>
    <text x="64" y="540" font-size="12" fill="#3b2922">木探索は 1 問 1.8 秒・約 $0.002。全文検索だけで 90% 出る（質問が文書の語を含む評価なので）</text>
    <text x="64" y="560" font-size="12" fill="#3b2922">Jev を足して増えるのは 2 問と、節でなく段落まで絞れること</text>
  </g>

  <!-- 右: 総当たり -->
  <rect x="712" y="110" width="448" height="470" rx="12" fill="#ffffff" stroke="#3b2922" stroke-width="2"/>
  <text x="736" y="146" font-size="20" font-weight="700" fill="#3b2922">総当たり</text>
  <text x="736" y="168" font-size="13" fill="#3b2922">全段落を 10k トークンずつに割り、全チャンクを並列に投げる。</text>
  <text x="736" y="186" font-size="13" fill="#3b2922">各チャンクで Choice「答えの段落はどれか」+ Noul「答えがあるか」</text>

  <g font-size="12" fill="#19120f">
    <rect x="736" y="204" width="120" height="40" rx="6" fill="#f9f5f2" stroke="#3b2922"/><text x="752" y="228">chunk 1</text>
    <rect x="872" y="204" width="120" height="40" rx="6" fill="#f9f5f2" stroke="#3b2922"/><text x="888" y="228">chunk 2</text>
    <rect x="1008" y="204" width="120" height="40" rx="6" fill="#f9f5f2" stroke="#3b2922"/><text x="1024" y="228">… chunk 22</text>
  </g>
  <line x1="796" y1="244" x2="930" y2="290" stroke="#3b2922" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="932" y1="244" x2="932" y2="290" stroke="#3b2922" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1068" y1="244" x2="934" y2="290" stroke="#3b2922" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="800" y="292" width="264" height="50" rx="8" fill="#f9f5f2" stroke="#3b2922"/>
  <text x="816" y="313" font-size="14" font-weight="700" fill="#19120f">Noul の値で全チャンクの勝者を並べる</text>
  <text x="816" y="332" font-size="12" fill="#3b2922">Choice の確率はチャンクをまたいで比べられない</text>
  <line x1="932" y1="342" x2="932" y2="364" stroke="#3b2922" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="800" y="366" width="264" height="36" rx="8" fill="#f9f5f2" stroke="#3b2922"/>
  <text x="816" y="389" font-size="14" font-weight="700" fill="#19120f">上位だけ Noul で確認（木探索の 3 と同じ）</text>

  <g font-size="13" fill="#19120f">
    <text x="736" y="438" font-weight="700" fill="#3b2922">総当たりの評価（Zod + Hono 24 問）</text>
    <line x1="736" y1="448" x2="1136" y2="448" stroke="#e1dcd8"/>
    <text x="736" y="472">木探索 + 全文検索</text>   <text x="860" y="472">22/24</text> <text x="940" y="472">2.6 秒</text> <text x="1020" y="472">38k</text>
    <text x="736" y="498">総当たり</text> <text x="860" y="498" font-weight="700">23/24</text> <text x="940" y="498" font-weight="700">1.2 秒</text> <text x="1020" y="498">335k</text>
    <text x="736" y="534" font-size="12" fill="#3b2922">往復 2 回で済むので速い。時間は文書量に依存せず、費用だけ比例</text>
    <text x="736" y="554" font-size="12" fill="#3b2922">4 サイト全部なら 1 問 $0.03。1,500 万トークンなら $0.6・60 秒</text>
  </g>

  <!-- 下: 結論 -->
  <rect x="40" y="604" width="1120" height="84" rx="12" fill="#19120f"/>
  <text x="64" y="638" font-size="16" font-weight="700" fill="#f0b9a4">質問が文書の語を含むなら全文検索だけで足りる。言い換えや別言語なら Jev、数十万トークンまでは総当たりが単純</text>
  <text x="64" y="666" font-size="14" fill="#f0b9a4">費用やレート上限が効く規模から、木でサイト・ページ群まで絞り、その下を総当たりする。降りるなら全文検索で拾った節も並べる</text>
</svg>
