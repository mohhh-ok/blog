<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" role="img" aria-label="システム構成図">
  <rect width="880" height="640" fill="#f2f0ee"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b2922"/>
    </marker>
  </defs>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#19120f">システム構成</text>

  <!-- browser -->
  <rect x="185" y="56" width="260" height="50" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="315" y="77" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">ブラウザ / モバイルアプリ</text>
  <text x="315" y="95" font-size="11" fill="#3b2922" text-anchor="middle">Next.js + Remotion Player / Capacitor</text>

  <!-- cloudflare -->
  <rect x="185" y="128" width="260" height="46" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="315" y="147" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Cloudflare</text>
  <text x="315" y="164" font-size="11" fill="#3b2922" text-anchor="middle">WAF / Bot対策 / Geo Block / CDN</text>

  <!-- GCP box -->
  <rect x="30" y="200" width="570" height="400" rx="14" fill="none" stroke="#8a000d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="48" y="222" font-size="13" font-weight="700" fill="#8a000d">Google Cloud</text>

  <rect x="50" y="238" width="250" height="56" rx="10" fill="#ffffff" stroke="#bb5537" stroke-width="2"/>
  <text x="175" y="260" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Web（Cloud Run）</text>
  <text x="175" y="279" font-size="11" fill="#3b2922" text-anchor="middle">SSR・Server Actions・検索</text>

  <rect x="330" y="238" width="250" height="56" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="455" y="260" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Cloud Tasks</text>
  <text x="455" y="279" font-size="11" fill="#3b2922" text-anchor="middle">用途別キュー・リトライ</text>

  <rect x="50" y="322" width="250" height="64" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="175" y="344" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Media Processor（Cloud Run）</text>
  <text x="175" y="363" font-size="11" fill="#3b2922" text-anchor="middle">FFmpeg変換・Remotion合成</text>
  <text x="175" y="378" font-size="11" fill="#3b2922" text-anchor="middle">PDF/PPT画像化・Boxインポート</text>

  <rect x="330" y="322" width="250" height="64" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="455" y="344" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Job Worker（Cloud Run）</text>
  <text x="455" y="363" font-size="11" fill="#3b2922" text-anchor="middle">C2PA署名・AI分類・埋め込み</text>
  <text x="455" y="378" font-size="11" fill="#3b2922" text-anchor="middle">翻訳・メール・cron</text>

  <rect x="50" y="414" width="530" height="64" rx="10" fill="#ffffff" stroke="#bb5537" stroke-width="2"/>
  <text x="315" y="436" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Avatar Orchestrator（Cloud Run）</text>
  <text x="315" y="455" font-size="11" fill="#3b2922" text-anchor="middle">イベント駆動の状態機械: TTS → リップシンク → マッティング → エンコード</text>
  <text x="315" y="470" font-size="11" fill="#3b2922" text-anchor="middle">幕ごとの並列生成・再利用キャッシュ・コスト記録</text>

  <rect x="50" y="506" width="160" height="72" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="130" y="530" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Cloud SQL</text>
  <text x="130" y="549" font-size="11" fill="#3b2922" text-anchor="middle">PostgreSQL + pgvector</text>
  <text x="130" y="564" font-size="11" fill="#3b2922" text-anchor="middle">Drizzle ORM</text>

  <rect x="235" y="506" width="160" height="72" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="315" y="530" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Memorystore</text>
  <text x="315" y="549" font-size="11" fill="#3b2922" text-anchor="middle">Redis</text>
  <text x="315" y="564" font-size="11" fill="#3b2922" text-anchor="middle">キャッシュ / レート制限</text>

  <rect x="420" y="506" width="160" height="72" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="500" y="530" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Cloud Storage</text>
  <text x="500" y="549" font-size="11" fill="#3b2922" text-anchor="middle">Public / Private バケット</text>
  <text x="500" y="564" font-size="11" fill="#3b2922" text-anchor="middle">素材・生成物</text>

  <!-- external -->
  <text x="650" y="222" font-size="13" font-weight="700" fill="#3b2922">外部サービス</text>

  <rect x="640" y="238" width="210" height="50" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="745" y="259" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Gemini / OpenAI</text>
  <text x="745" y="277" font-size="11" fill="#3b2922" text-anchor="middle">台本整形・翻訳・字幕・Embedding</text>

  <rect x="640" y="346" width="210" height="50" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="745" y="367" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Fish Audio</text>
  <text x="745" y="385" font-size="11" fill="#3b2922" text-anchor="middle">声クローン TTS</text>

  <rect x="640" y="414" width="210" height="64" rx="10" fill="#19120f"/>
  <text x="745" y="436" font-size="13" font-weight="700" fill="#f0b9a4" text-anchor="middle">RunPod（GPU サーバーレス）</text>
  <text x="745" y="455" font-size="11" fill="#f2f0ee" text-anchor="middle">LatentSync リップシンク</text>
  <text x="745" y="470" font-size="11" fill="#f2f0ee" text-anchor="middle">RVM マッティング</text>

  <rect x="640" y="496" width="210" height="50" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="745" y="517" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">fal.ai</text>
  <text x="745" y="535" font-size="11" fill="#3b2922" text-anchor="middle">背景の画像・動画生成</text>

  <rect x="640" y="556" width="210" height="44" rx="10" fill="#ffffff" stroke="#3b2922" stroke-width="1.5"/>
  <text x="745" y="575" font-size="13" font-weight="700" fill="#19120f" text-anchor="middle">Stripe</text>
  <text x="745" y="591" font-size="11" fill="#3b2922" text-anchor="middle">サブスク・クレジット決済</text>

  <!-- arrows -->
  <g fill="none" stroke="#3b2922" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M315 106 L315 128"/>
    <path d="M315 174 L315 190 L175 190 L175 238"/>
    <path d="M300 266 L330 266"/>
    <path d="M455 294 L455 322"/>
    <path d="M400 294 L400 308 L175 308 L175 322"/>
    <path d="M60 294 L40 294 L40 446 L50 446"/>
    <path d="M580 446 L640 446"/>
    <path d="M580 432 L615 432 L615 371 L640 371"/>
    <path d="M580 354 L615 354 L615 263 L640 263"/>
  </g>

  <text x="30" y="626" font-size="11" fill="#3b2922">IaC: Pulumi（GCP・Cloudflare） / デプロイ: GitHub Actions / 監視: Sentry</text>
</svg>
